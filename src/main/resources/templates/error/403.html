<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>403 접근 거부</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin: 0; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; background: #f8f9fa; color: #1f2937; }
        .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card { max-width: 560px; width: 100%; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { margin: 0 0 18px; line-height: 1.55; }
        .code { display: inline-block; font-weight: 700; color: #ef4444; margin-bottom: 12px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { text-decoration: none; padding: 10px 14px; border-radius: 8px; border: 1px solid #d1d5db; color: #111827; }
        .btn.primary { background: #111827; color: #fff; border-color: #111827; }
        .meta { margin-top: 18px; font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <span class="code">403 Forbidden</span>
        <h1>접근 권한이 없습니다.</h1>
        <p>현재 계정은 요청한 페이지에 접근할 수 없습니다.<br>관리자 계정으로 로그인 후 다시 시도해 주세요.</p>
        <div class="actions">
            <a class="btn" th:href="@{/products}">상품 목록</a>
            <a class="btn primary" th:href="@{/home}">홈으로 이동</a>
        </div>
        <div class="meta" th:text="${'확인 시각: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}">
            확인 시각: 2026-05-28 00:00:00
        </div>
    </div>
</div>
</body>
</html>
